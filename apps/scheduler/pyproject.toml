[project]
name = "campussync-scheduler"
version = "0.1.0"
description = "Stateless CP-SAT scheduling service for CampusSync AI V2"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi[standard]==0.156.5",
  "ortools==9.15.6755",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
