services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: campussync
      POSTGRES_USER: campussync
      POSTGRES_PASSWORD: campussync
    ports:
      - "5432:5432"
    volumes:
      - campussync_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campussync -d campussync"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  campussync_postgres:
